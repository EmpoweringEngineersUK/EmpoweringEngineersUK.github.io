<html lang="en-GB">
<head>

    <meta property="og:description" content="Access curated gold-standard engineering textbooks, BS/EN/ISO standards, and technical resources across all disciplines to support your professional development.">
    <meta property="og:image" content="https://www.empoweringengineers.uk/EE_Logo_rect_Solid.png">
    <meta property="og:url" content="https://www.empoweringengineers.uk/reference_tool.html">
    <meta property="og:type" content="website">
    <title>Engineering Reference Library | Empowering Engineers UK</title>  
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <link rel="manifest" href="/site.webmanifest">
    <link href="https://fonts.googleapis.com/css2?family=Lora:wght@700&family=Courier+Prime&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="layout.css?v=13.1">

    <script type="application/ld+json">
	{
	  "@context": "https://schema.org",
	  "@type": "WebApplication",
	  "name": "Engineering Library",

	  "description": "A curated database of technical engineering references, formulas, and standards to support daily engineering tasks.",
	  "applicationCategory": "ReferenceApplication",
	  "operatingSystem": "All",
	  "browserRequirements": "Requires JavaScript",
	  "publisher": {
		"@type": "Organization",
		"name": "Empowering Engineers UK",
		"url": "https://www.empoweringengineers.uk/"
	  },
	  "offers": {
		"@type": "Offer",
		"price": "0",
		"priceCurrency": "GBP"
	  }
	}
	</script>

    <style>
        /* --- GLOBAL INPUT INHERITANCE --- */
        select, input[type="text"] {
            width: 100%;
            padding: 10px 12px;
            background-color: var(--input-bg);
            color: var(--cloud-white);
            border: 1px solid var(--border-color);
            border-radius: 4px;
            font-size: 0.95rem;
            margin-bottom: 15px;
            font-family: inherit;
            transition: border-color 0.2s, box-shadow 0.2s, background-color 0.2s;
            box-sizing: border-box;
        }

        select { cursor: pointer; }
        input[type="text"] { cursor: text; }

        select:hover, input[type="text"]:hover {
            border-color: var(--slate-grey);
            background-color: var(--midnight-navy);
        }

        select:focus, input[type="text"]:focus {
            outline: none;
            border-color: var(--terminal-green);
            box-shadow: 0 0 5px var(--hover-green);
            background-color: var(--midnight-navy);
        }

        select option {
            background-color: var(--midnight-navy);
            color: var(--cloud-white);
        }

        label {
            color: var(--burnt-orange); 
            font-size: 0.85rem; 
            font-weight: bold; 
            margin-bottom: 5px; 
            display:block; 
            text-transform:uppercase;
            letter-spacing: 0.5px;
        }

        /* --- PAGE SPECIFIC STRUCTURE --- */
        .main-grid {
            display: grid;
            grid-template-columns: 350px 1fr;
            gap: 30px;
            max-width: 1300px;
            margin: 20px auto;
            padding: 0 20px;
            align-items: start;
        }

        /* Sticky Left Column to ensure Ad stays in view */
        .controls-col {
            position: sticky;
            top: 20px;
            height: fit-content;
        }

        /* Internal Scrollable Grid */
        .ref-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
            max-height: 750px; /* Constrains height to approx 2.5 rows */
            overflow-y: auto;  /* Triggers internal scroll */
            padding-right: 15px; /* Room for scrollbar */
            align-content: start; /* Prevents single items stretching the full 750px */
        }

        /* Custom Scrollbar for the Grid */
        .ref-grid::-webkit-scrollbar {
            width: 8px;
        }
        .ref-grid::-webkit-scrollbar-track {
            background: var(--input-bg);
            border-radius: 4px;
        }
        .ref-grid::-webkit-scrollbar-thumb {
            background: var(--border-color);
            border-radius: 4px;
        }
        .ref-grid::-webkit-scrollbar-thumb:hover {
            background: var(--slate-grey);
        }

        .ref-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 20px;
            transition: transform 0.2s ease, background-color 0.2s ease, border-top-color 0.2s ease;
            display: flex;
            flex-direction: column;
            border-top: 3px solid var(--border-color);
            height: 100%;
            box-sizing: border-box;
        }

        .ref-card:hover {
            transform: translateY(-3px);
            background-color: var(--hover-green);
            border-top-color: var(--terminal-green);
        }

        .badge-disc {
            background: var(--input-bg);
            border: 1px solid var(--border-color);
            color: var(--slate-grey);
            padding: 3px 8px;
            border-radius: 4px;
            font-size: 0.7rem;
            font-weight: bold;
            text-transform: uppercase;
        }

        .topic-tag {
            color: var(--terminal-green);
            font-size: 0.8rem;
            font-weight: bold;
            margin-bottom: 10px;
            display: block;
            font-family: 'Courier Prime', monospace;
        }

        .ref-type {
            background: var(--burnt-orange);
            color: var(--midnight-navy);
            padding: 3px 8px;
            border-radius: 4px;
            font-size: 0.7rem;
            font-weight: bold;
            text-transform: uppercase;
            margin-right: 5px;
        }

        .ref-title {
            font-size: 1.1rem;
            font-weight: bold;
            color: var(--cloud-white);
            margin: 10px 0 5px 0;
            line-height: 1.3;
        }

        .ref-desc {
            font-size: 0.85rem;
            color: var(--slate-grey);
            line-height: 1.5;
            margin-bottom: 15px;
            flex-grow: 1;
        }

        .ref-link {
            color: var(--status-blue);
            text-decoration: none;
            font-weight: bold;
            font-size: 0.9rem;
            display: inline-block;
            margin-top: auto;
            transition: color 0.2s;
        }

        .ref-link:hover { color: var(--terminal-green); }

        /* Responsive Breakpoints */
        @media (max-width: 900px) {
            .main-grid { grid-template-columns: 1fr; }
            .controls-col { position: relative; top: 0; }
            .ref-grid { max-height: none; overflow-y: visible; padding-right: 0; }
        }
    </style>
</head>
<body onload="initApp()">

    <script defer src="header_nav.js?v=13.1"></script>
    <script defer src="tools_data.js?v=14"></script>

    <div class="container" style="margin-top: 0;"> 
        <div id="tool-header-target" style="grid-column: 1 / -1;"></div>
    </div>

    <div class="main-grid">
        
        <div class="controls-col">
            <div class="card" style="padding: 25px;">
                <div style="color:var(--terminal-green); border-bottom:1px dashed var(--slate-grey); margin-bottom:15px; font-weight:bold; text-transform:uppercase;">
                    >> Filter Library
                </div>
                
                <label for="searchInput">Search Database</label>
                <input type="text" id="searchInput" placeholder="e.g. 'Standards', 'Python', 'Pump'..." oninput="handleFilterChange('search')">

                <label for="discSelect">Discipline</label>
                <select id="discSelect" onchange="handleFilterChange('disc')">
                    <option value="All">All Disciplines</option>
                </select>

                <label for="typeSelect">Resource Type</label>
                <select id="typeSelect" onchange="handleFilterChange('type')">
                    <option value="All">All Types</option>
                </select>

                <label for="topicSelect">Topic</label>
                <select id="topicSelect" onchange="handleFilterChange('topic')">
                    <option value="All">All Topics</option>
                </select>
            </div>

            <div class="ad-mpu-container" style="margin: 20px auto; position: relative;">
                <span style="font-size:0.6rem; color:var(--slate-grey); text-transform:uppercase; position:absolute; top: 5px; width: 100%; text-align: center;">Advertisement</span>
                <ins class="adsbygoogle"
                     style="display:inline-block;width:300px;height:250px"
                     data-ad-client="ca-pub-7071036534151105"
                     data-ad-slot="4413012282"></ins>
                <script>
                     (adsbygoogle = window.adsbygoogle || []).push({});
                </script>
            </div>
        </div>

        <div>
            <div id="libraryGrid" class="ref-grid">
                </div>
        </div>

    </div>

    <script>
        // --- 1. MASTER INITIALISATION ---
        function initApp() {
            // Trigger Header Injection
            if (typeof renderToolHeader === "function") {
                renderToolHeader('reference');
            } else {
                console.warn("Tool Header system not loaded.");
            }

            // Verify External Database is loaded
            if (typeof refDb === 'undefined') {
                console.error("Critical Error: references.js not loaded or variable refDb missing.");
                document.getElementById('libraryGrid').innerHTML = "<div style='color:var(--burnt-orange); grid-column:1/-1; text-align:center; padding: 40px; border: 1px dashed var(--border-color);'>Database Error: references.js failed to load. Please check file structure.</div>";
                return;
            }

            // Initial Populate Dropdowns based on the external database
            updateDropdownOptions('init'); 

            // Initial Render
            filterRefs();
        }

        // Helper to get unique sorted values from the DB
        function getUniqueValues(key) {
            return [...new Set(refDb.map(item => item[key]))].sort();
        }

        // --- CORE CASCADING LOGIC ---
        function handleFilterChange(changedSource) {
            updateDropdownOptions(changedSource); 
            filterRefs(); // Updates the grid
        }

        function updateDropdownOptions(source) {
            const discSelect = document.getElementById('discSelect');
            const typeSelect = document.getElementById('typeSelect');
            const topicSelect = document.getElementById('topicSelect');
            
            const currentDisc = discSelect.value;
            const currentType = typeSelect.value;
            const currentTopic = topicSelect.value;
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();

            // 1. Get all base unique values from external references.js
            const allDiscs = getUniqueValues('disc');
            const allTypes = getUniqueValues('type');
            const allTopics = getUniqueValues('topic');

            // 2. Validation Function
            function isOptionValid(field, value) {
                return refDb.some(item => {
                    if (item[field] !== value) return false;

                    const matchDisc = (field === 'disc') ? true : (currentDisc === 'All' || item.disc === currentDisc || item.disc === 'General');
                    const matchType = (field === 'type') ? true : (currentType === 'All' || item.type === currentType);
                    const matchTopic = (field === 'topic') ? true : (currentTopic === 'All' || item.topic === currentTopic);
                    const matchSearch = !searchTerm || (item.title.toLowerCase().includes(searchTerm) || item.desc.toLowerCase().includes(searchTerm));

                    return matchDisc && matchType && matchTopic && matchSearch;
                });
            }

            // 3. Re-Populate Dropdowns intelligently
            if (source !== 'disc') renderSelect(discSelect, allDiscs, 'disc', currentDisc, isOptionValid);
            if (source !== 'type') renderSelect(typeSelect, allTypes, 'type', currentType, isOptionValid);
            if (source !== 'topic') renderSelect(topicSelect, allTopics, 'topic', currentTopic, isOptionValid);
            
            // 4. Auto-Correction if selection becomes invalid
            if (currentDisc !== 'All' && !isOptionValid('disc', currentDisc) && source !== 'disc') {
                discSelect.value = 'All'; 
            }
            if (currentType !== 'All' && !isOptionValid('type', currentType) && source !== 'type') {
                typeSelect.value = 'All';
            }
            if (currentTopic !== 'All' && !isOptionValid('topic', currentTopic) && source !== 'topic') {
                topicSelect.value = 'All';
            }
        }

        function renderSelect(selectElement, allValues, fieldName, currentVal, validationFn) {
            let valToKeep = selectElement.value; 
            
            // Clean up the label naming convention
            let labelName = fieldName.charAt(0).toUpperCase() + fieldName.slice(1);
            if (fieldName === 'disc') labelName = "Disciplines";
            if (fieldName === 'type') labelName = "Types";
            if (fieldName === 'topic') labelName = "Topics";

            selectElement.innerHTML = `<option value="All">All ${labelName}</option>`;
            
            allValues.forEach(val => {
                // ONLY append the option if it contains valid data based on other filters
                if (validationFn(fieldName, val)) {
                    const opt = document.createElement('option');
                    opt.value = val;
                    opt.innerText = val;
                    selectElement.appendChild(opt);
                }
            });

            // Ensure the dropdown doesn't blank out if the previous selection was removed
            const optionExists = Array.from(selectElement.options).some(opt => opt.value === valToKeep);
            selectElement.value = optionExists ? valToKeep : "All";
        }

        // --- FILTER & SORT LOGIC ---
        function filterRefs() {
            const searchFilter = document.getElementById('searchInput').value.toLowerCase();
            const discFilter = document.getElementById('discSelect').value;
            const typeFilter = document.getElementById('typeSelect').value;
            const topicFilter = document.getElementById('topicSelect').value;
            
            const grid = document.getElementById('libraryGrid');
            grid.innerHTML = "";

            // 1. FILTER
            const filteredItems = refDb.filter(ref => {
                const matchDisc = discFilter === "All" || ref.disc === discFilter || (discFilter !== "All" && ref.disc === "General"); 
                const matchType = typeFilter === "All" || ref.type === typeFilter;
                const matchTopic = topicFilter === "All" || ref.topic === topicFilter;
                
                let matchSearch = true;
                if(searchFilter) {
                    matchSearch = ref.title.toLowerCase().includes(searchFilter) || 
                                  ref.desc.toLowerCase().includes(searchFilter) || 
                                  ref.topic.toLowerCase().includes(searchFilter);
                }

                return matchDisc && matchType && matchTopic && matchSearch;
            });

            // 2. SORT (Priority: Exact Match > Alpha)
            filteredItems.sort((a, b) => {
                if (discFilter !== "All") {
                    const aIsExact = a.disc === discFilter;
                    const bIsExact = b.disc === discFilter;
                    if (aIsExact && !bIsExact) return -1; 
                    if (!aIsExact && bIsExact) return 1;  
                }
                return a.title.localeCompare(b.title);
            });

            // 3. RENDER
            if(filteredItems.length === 0) {
                grid.innerHTML = `
                    <div style='color:var(--slate-grey); grid-column:1/-1; text-align:center; padding:40px; border:1px dashed var(--border-color); border-radius:8px;'>
                        <p style="font-size:1.2rem; margin-bottom:10px;">No results found.</p>
                        <p>Try resetting your filters.</p>
                    </div>`;
                return;
            }

            filteredItems.forEach(ref => {
                const card = document.createElement('div');
                card.className = "ref-card";
                card.innerHTML = `
                    <div style="margin-bottom:5px;">
                        <span class="ref-type">${ref.type}</span>
                        <span class="badge-disc">${ref.disc}</span>
                    </div>
                    <div class="ref-title">${ref.title}</div>
                    <span class="topic-tag">> ${ref.topic}</span>
                    <div class="ref-desc">${ref.desc}</div>
                    <a href="${ref.link}" target="_blank" class="ref-link">Open Resource ↗</a>
                `;
                grid.appendChild(card);
            });
        }
    </script>
    
    <script defer src="footer.js?v=13.1"></script>
</body>
</html>
