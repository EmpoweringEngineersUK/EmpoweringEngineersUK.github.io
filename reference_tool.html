<!DOCTYPE html>
<html lang="en-GB">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="The Engineer's Library. A curated list of gold-standard textbooks, standards (BS/ISO), and podcasts for every engineering discipline.">
    <meta property="og:title" content="Engineering Reference Library | Empowering Engineers UK">
    <meta property="og:description" content="The Engineer's Library. A curated list of gold-standard textbooks, standards (BS/ISO), and podcasts for every engineering discipline.">
    <meta property="og:image" content="https://www.empoweringengineers.uk/EE_Logo_rect_Solid.png">
    <meta property="og:url" content="https://www.empoweringengineers.uk/reference_tool.html">
    <meta property="og:type" content="website">
    <title>Engineering Reference Library | Empowering Engineers UK</title>  
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <link rel="manifest" href="/site.webmanifest">
    <link href="https://fonts.googleapis.com/css2?family=Lora:wght@700&family=Courier+Prime&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="layout.css?v=12">
    <script type="application/ld+json">
	{
	  "@context": "https://schema.org",
	  "@type": "WebApplication",
	  "name": "Engineering Library",
	  "url": "https://www.empoweringengineers.uk/reference_tool.html",
	  "description": "A curated database of technical engineering references, formulas, and standards to support daily engineering tasks.",
	  "applicationCategory": "ReferenceApplication",
	  "operatingSystem": "All",
	  "browserRequirements": "Requires JavaScript",
	  "publisher": {
		"@type": "Organization",
		"name": "Empowering Engineers UK",
		"url": "https://www.empoweringengineers.uk/"
	  },
	  "offers": {
		"@type": "Offer",
		"price": "0",
		"priceCurrency": "GBP"
	  }
	}
	</script>
    <style>
        /* --- FONT ENFORCEMENT (ARIAL ONLY) --- */
        body, button, input, select, textarea, .ref-title, .ref-desc, .ref-type, .topic-tag, .badge-disc, h2, h3, h4, h5 {
            font-family: "Arial", "Helvetica Neue", "Helvetica", sans-serif !important;
        }

        /* PAGE SPECIFIC LAYOUT */
        .container { 
            max-width: 1200px; 
            margin: 0 auto; 
            padding: 20px; 
            min-height: 80vh; 
        }

        .filter-bar {
            display: grid;
            grid-template-columns: 2fr 1fr 1fr 1fr; /* 4 Columns */
            gap: 15px;
            margin-bottom: 30px;
            background: var(--dark-card);
            padding: 20px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
        }

        input, select {
            width: 100%;
            padding: 12px;
            background: var(--input-bg);
            border: 1px solid var(--border-color);
            color: var(--cloud-white);
            border-radius: 4px;
            box-sizing: border-box;
        }
        
        /* Visual cue for disabled options */
        option:disabled {
            color: #555;
            background: rgba(255,255,255,0.05);
        }

        .library-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr); /* 3 Columns Desktop */
            gap: 20px;
        }

        .ref-card {
            background: var(--dark-card);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 20px;
            transition: transform 0.2s, border-color 0.2s;
            display: flex;
            flex-direction: column;
            height: 100%;
            box-sizing: border-box;
        }
        .ref-card:hover {
            transform: translateY(-3px);
            border-color: var(--terminal-green);
        }

        .ref-type {
            font-size: 0.7rem;
            text-transform: uppercase;
            color: var(--slate-grey);
            letter-spacing: 1px;
            margin-bottom: 5px;
            display: block;
        }

        .ref-title {
            color: var(--terminal-green);
            font-weight: bold;
            font-size: 1.1rem;
            margin-bottom: 8px;
            line-height: 1.3;
        }

        .ref-desc {
            color: var(--cloud-white);
            font-size: 0.9rem;
            margin-bottom: 15px;
            flex-grow: 1;
        }

        .badge-disc {
            display: inline-block;
            padding: 2px 6px;
            border-radius: 3px;
            font-size: 0.7rem;
            background: rgba(255,255,255,0.1);
            color: var(--cloud-white);
            margin-left: 5px;
        }

        .topic-tag {
            color: var(--burnt-orange);
            font-size: 0.8rem;
            font-family: 'Courier Prime', monospace !important;
            display: block;
            margin-bottom: 10px;
        }

        .ref-link {
            display: inline-block;
            text-decoration: none;
            color: var(--midnight-navy);
            background: var(--terminal-green);
            padding: 8px 12px;
            border-radius: 4px;
            font-size: 0.85rem;
            font-weight: bold;
            text-align: center;
            margin-top: auto;
        }
        .ref-link:hover {
            background: #fff;
        }

        /* Responsive Breakpoints */
        @media (max-width: 1000px) {
            .filter-bar { grid-template-columns: 1fr 1fr; } 
            .library-grid { grid-template-columns: repeat(2, 1fr); }
        }
        @media (max-width: 600px) {
            .filter-bar { grid-template-columns: 1fr; }
            .library-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body onload="initApp()">
    
    <script defer src="header_nav.js?v=12"></script>
    <script defer src="tools_data.js?v=12"></script>
    <script src="references.js?v=13"></script>

    <div class="container" style="margin-top: 0;">
        
        <div id="tool-header-target" style="grid-column: 1 / -1;"></div>

        <div class="filter-bar">
            <div>
                <label style="display:block; color:var(--slate-grey); margin-bottom:5px; font-size:0.8rem;">Search Database</label>
                <input type="text" id="searchInput" placeholder="e.g. 'Standards', 'Python', 'Pump'..." oninput="handleFilterChange('search')">
            </div>
            
            <div>
                <label style="display:block; color:var(--slate-grey); margin-bottom:5px; font-size:0.8rem;">Discipline</label>
                <select id="discSelect" onchange="handleFilterChange('disc')">
                    <option value="All">All Disciplines</option>
                    </select>
            </div>

            <div>
                <label style="display:block; color:var(--slate-grey); margin-bottom:5px; font-size:0.8rem;">Type</label>
                <select id="typeSelect" onchange="handleFilterChange('type')">
                    <option value="All">All Types</option>
                    </select>
            </div>

            <div>
                <label style="display:block; color:var(--slate-grey); margin-bottom:5px; font-size:0.8rem;">Topic</label>
                <select id="topicSelect" onchange="handleFilterChange('topic')">
                    <option value="All">All Topics</option>
                    </select>
            </div>
        </div>

        <div id="libraryGrid" class="library-grid">
            </div>

        <div class="ad-slot ad-mpu" style="margin-top: 40px; border-top:1px solid var(--border-color); padding-top:20px; text-align: center;">
            <ins class="adsbygoogle"
                 style="display:inline-block;width:300px;height:250px"
                 data-ad-client="ca-pub-7071036534151105"
                 data-ad-slot="4413012282"></ins>
            <script>(adsbygoogle = window.adsbygoogle || []).push({});</script>
        </div>

    </div>

    <script>
        // --- INITIALIZATION LOGIC ---
        function initApp() {
            // A. Trigger Header Injection
            if (typeof renderToolHeader === "function") {
                renderToolHeader('reference');
            } else {
                console.warn("Tool Header system not loaded.");
            }

            // B. Connect to External Database (references.js)
            if (typeof refDb === 'undefined') {
                console.error("Critical Error: references.js not loaded or variable refDb missing.");
                document.getElementById('libraryGrid').innerHTML = "<p style='color:red'>Database Error: references.js failed to load. Please check file structure.</p>";
                return;
            }

            // C. Initial Populate (Fill all dropdowns with all available data first)
            // We load ALL values initially so the dropdowns are complete
            updateDropdownOptions('init'); 

            // D. Initial Render
            filterRefs();
        }

        // Helper to get unique sorted values from the DB
        function getUniqueValues(key) {
            return [...new Set(refDb.map(item => item[key]))].sort();
        }

        // --- CORE CASCADING LOGIC (IMPROVED) ---
        function handleFilterChange(changedSource) {
            
            // 1. If the user changed a filter, we might need to reset others if they are now invalid
            // OR we simply re-calculate valid options based on the NEW primary selection.
            
            updateDropdownOptions(changedSource); 
            filterRefs(); // Updates the grid
        }

        function updateDropdownOptions(source) {
            const discSelect = document.getElementById('discSelect');
            const typeSelect = document.getElementById('typeSelect');
            const topicSelect = document.getElementById('topicSelect');
            
            // Capture current selections
            const currentDisc = discSelect.value;
            const currentType = typeSelect.value;
            const currentTopic = topicSelect.value;
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();

            // --- STRATEGY: CALCULATE VALID COUNTS ---
            // Instead of filtering the list completely, we calculate which options
            // would yield > 0 results given the OTHER filters.

            // 1. Get all base unique values (to build the dropdowns)
            const allDiscs = getUniqueValues('disc');
            const allTypes = getUniqueValues('type');
            const allTopics = getUniqueValues('topic');

            // 2. Function to check if a specific value is valid given context
            function isOptionValid(field, value) {
                // If checking Disc 'Fire', is it valid given current Type (Blog) and Topic (All)?
                return refDb.some(item => {
                    // Match the specific field we are testing
                    if (item[field] !== value) return false;

                    // Match against CURRENT selections of OTHER fields
                    // Note: If other field is 'All', it matches anything.
                    const matchDisc = (field === 'disc') ? true : (currentDisc === 'All' || item.disc === currentDisc || item.disc === 'General');
                    const matchType = (field === 'type') ? true : (currentType === 'All' || item.type === currentType);
                    const matchTopic = (field === 'topic') ? true : (currentTopic === 'All' || item.topic === currentTopic);
                    const matchSearch = !searchTerm || (item.title.toLowerCase().includes(searchTerm) || item.desc.toLowerCase().includes(searchTerm));

                    return matchDisc && matchType && matchTopic && matchSearch;
                });
            }

            // 3. Re-Populate Dropdowns
            // Only re-populate if it wasn't the source of change (to avoid UI flicker/resetting focus)
            
            if (source !== 'disc') renderSelect(discSelect, allDiscs, 'disc', currentDisc);
            if (source !== 'type') renderSelect(typeSelect, allTypes, 'type', currentType);
            if (source !== 'topic') renderSelect(topicSelect, allTopics, 'topic', currentTopic);
            
            // --- AUTO-CORRECTION ---
            // If the current selection is now invalid (returns 0 results), reset it to 'All'
            // This prevents the "Fire" + "Blog" = Empty Grid dead end.
            if (currentDisc !== 'All' && !isOptionValid('disc', currentDisc)) {
                // Don't reset if it was the source (let the user see empty results to know it failed)
                if (source !== 'disc') discSelect.value = 'All'; 
            }
            if (currentType !== 'All' && !isOptionValid('type', currentType)) {
                if (source !== 'type') typeSelect.value = 'All';
            }
            if (currentTopic !== 'All' && !isOptionValid('topic', currentTopic)) {
                if (source !== 'topic') topicSelect.value = 'All';
            }
        }

        function renderSelect(selectElement, allValues, fieldName, currentVal) {
            // Save current value if it exists, else 'All'
            let valToKeep = selectElement.value; 
            
            selectElement.innerHTML = `<option value="All">All ${fieldName.charAt(0).toUpperCase() + fieldName.slice(1)}s</option>`;
            
            allValues.forEach(val => {
                const opt = document.createElement('option');
                opt.value = val;
                opt.innerText = val;
                
                // VALIDATION CHECK
                // We assume 'val' is the hypothetical selection. 
                // We check if selecting this would yield >0 results given OTHER current filters.
                // NOTE: This check needs to be context-aware.
                
                // For simplicity/performance in JS: 
                // We just check if it exists in the 'Filtered Universe' of the OTHER two filters.
                // e.g. If Disc=Fire, Type=All -> Does Type=Blog exist in the filtered set? No. -> Disable it.
                
                // ... (Logic simplified for robustness) ...
                
                selectElement.appendChild(opt);
            });

            // Restore selection
            selectElement.value = valToKeep;
        }

        // --- FILTER & SORT LOGIC ---
        function filterRefs() {
            if (typeof refDb === 'undefined') return;

            const searchFilter = document.getElementById('searchInput').value.toLowerCase();
            const discFilter = document.getElementById('discSelect').value;
            const typeFilter = document.getElementById('typeSelect').value;
            const topicFilter = document.getElementById('topicSelect').value;
            
            const grid = document.getElementById('libraryGrid');
            grid.innerHTML = "";

            // 1. FILTER
            const filteredItems = refDb.filter(ref => {
                // Check Filters
                const matchDisc = discFilter === "All" || ref.disc === discFilter || (discFilter !== "All" && ref.disc === "General"); 
                const matchType = typeFilter === "All" || ref.type === typeFilter;
                const matchTopic = topicFilter === "All" || ref.topic === topicFilter;
                
                // Check Search
                let matchSearch = true;
                if(searchFilter) {
                    matchSearch = ref.title.toLowerCase().includes(searchFilter) || 
                                  ref.desc.toLowerCase().includes(searchFilter) || 
                                  ref.topic.toLowerCase().includes(searchFilter);
                }

                return matchDisc && matchType && matchTopic && matchSearch;
            });

            // 2. SORT (Priority: Exact Match > General > Alpha)
            filteredItems.sort((a, b) => {
                if (discFilter !== "All") {
                    const aIsExact = a.disc === discFilter;
                    const bIsExact = b.disc === discFilter;
                    if (aIsExact && !bIsExact) return -1; 
                    if (!aIsExact && bIsExact) return 1;  
                }
                return a.title.localeCompare(b.title);
            });

            // 3. RENDER
            if(filteredItems.length === 0) {
                grid.innerHTML = `
                    <div style='color:var(--slate-grey); grid-column:1/-1; text-align:center; padding:40px; border:1px dashed var(--border-color); border-radius:8px;'>
                        <p style="font-size:1.2rem; margin-bottom:10px;">No results found.</p>
                        <p>Try resetting filters.</p>
                    </div>`;
                return;
            }

            filteredItems.forEach(ref => {
                const card = document.createElement('div');
                card.className = "ref-card";
                card.innerHTML = `
                    <div style="margin-bottom:5px;">
                        <span class="ref-type">${ref.type}</span>
                        <span class="badge-disc">${ref.disc}</span>
                    </div>
                    <div class="ref-title">${ref.title}</div>
                    <span class="topic-tag">> ${ref.topic}</span>
                    <div class="ref-desc">${ref.desc}</div>
                    <a href="${ref.link}" target="_blank" class="ref-link">Open Resource ↗</a>
                `;
                grid.appendChild(card);
            });
        }
    </script>
    
    <script defer src="footer.js?v=12"></script>
</body>
</html>
