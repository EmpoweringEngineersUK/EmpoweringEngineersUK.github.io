<!DOCTYPE html>
<html lang="en-GB">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Navigate ethical dilemmas with the Royal Academy of Engineering principles. Generate professional scripts to challenge unsafe or unethical decisions.">
    
    <meta property="og:title" content="Ethics Compass | Empowering Engineers UK">
    <meta property="og:description" content="Navigate ethical dilemmas with the Royal Academy of Engineering principles. Generate professional scripts to challenge unsafe or unethical decisions.">
    <meta property="og:image" content="https://www.empoweringengineers.uk/EE_Logo_rect_Solid.png">
    <meta property="og:url" content="https://www.empoweringengineers.uk/ethics_tool.html">
    <meta property="og:type" content="website">

    <title>Ethics Compass | Empowering Engineers UK</title>

    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <link rel="manifest" href="/site.webmanifest">

    <link href="https://fonts.googleapis.com/css2?family=Lora:wght@700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="layout.css?v=13.1">

    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "SoftwareApplication",
      "name": "Engineering Ethics Compass",
      "operatingSystem": "Web Browser",
      "applicationCategory": "BusinessApplication",
      "url": "https://www.empoweringengineers.uk/ethics_tool.html",
      "description": "A digital ethics assistant that analyzes engineering dilemmas against the RAEng Statement of Ethical Principles and UK-SPEC requirements to generate professional action plans.",
      "offers": {
        "@type": "Offer",
        "price": "0.00",
        "priceCurrency": "GBP",
        "availability": "https://schema.org/InStock"
      },
      "author": {
        "@type": "Person",
        "name": "Murat Islam",
        "jobTitle": "EUR ING CEng IntPE(UK) FIMechE"
      },
      "featureList": [
        "RAEng Principle Mapping",
        "Conflict of Interest Analysis",
        "Whistleblowing Guidance",
        "AI Script Generation for Difficult Conversations"
      ]
    }
    </script>

    <style>
        /* Tool-Specific Styles */
        .principle-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 15px;
            margin-bottom: 25px;
        }

        .principle-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-color);
            padding: 15px;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s;
            text-align: center;
            font-size: 0.8rem;
            color: var(--slate-grey);
            font-weight: bold;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 80px;
        }

        .principle-btn:hover {
            border-color: var(--terminal-green);
            background: var(--hover-green);
            color: #fff;
        }

        .principle-btn.selected {
            background: var(--terminal-green);
            color: var(--midnight-navy);
            border-color: var(--terminal-green);
            box-shadow: 0 0 15px rgba(0, 255, 153, 0.3);
        }
        
        /* Ensure Inputs in the Top Left Grid fill their container */
        .context-stack input, .context-stack select {
            margin-bottom: 15px; 
        }
    </style>
</head>
<body>

    <div id="header-container"></div>

    <div class="container">
        <div id="tool-header-target"></div>

        <div class="card">
            
            <div class="tool-input-grid">
                
                <div class="context-stack">
                    <h4 class="section-label">1. Define the Context</h4>
                    <label>Your Role</label>
                    <input type="text" id="userRole" placeholder="e.g. Senior Design Engineer">
                    
                    <label>Industry</label>
                    <select id="industry">
                        <option value="Aerospace">Aerospace</option>
                        <option value="Construction">Construction / Civil</option>
                        <option value="Energy">Energy / Nuclear</option>
                        <option value="Manufacturing">Manufacturing</option>
                        <option value="Rail">Rail / Transport</option>
                        <option value="Software">Software / Cyber</option>
                        <option value="Defence">Defence</option>
                        <option value="Medical">Medical / Pharma</option>
                    </select>
                </div>

                <div class="tool-stack-right">
                    <div class="ad-mpu-container">
                        <ins class="adsbygoogle"
                             style="display:inline-block;width:300px;height:250px"
                             data-ad-client="ca-pub-7071036534151105"
                             data-ad-slot="9995687043"></ins>
                        <script>
                             (adsbygoogle = window.adsbygoogle || []).push({});
                        </script>
                        <span style="position: absolute; font-size: 10px; color: #555; margin-top: 260px;">ADVERTISEMENT</span>
                    </div>
                </div>

            </div>
            <h4 class="section-label" style="margin-top:10px;">2. Select Primary Ethical Principle (RAEng)</h4>
            <div class="principle-grid" id="principleGrid">
                <div class="principle-btn" onclick="selectPrinciple(this, 'Accuracy')">
                    <span>ACCURACY</span>
                    <small style="font-size:0.6rem; opacity:0.8; margin-top:5px;">Rigour & Truth</small>
                </div>
                <div class="principle-btn" onclick="selectPrinciple(this, 'Honesty')">
                    <span>HONESTY</span>
                    <small style="font-size:0.6rem; opacity:0.8; margin-top:5px;">Integrity</small>
                </div>
                <div class="principle-btn" onclick="selectPrinciple(this, 'Respect')">
                    <span>RESPECT</span>
                    <small style="font-size:0.6rem; opacity:0.8; margin-top:5px;">Law & Life</small>
                </div>
                <div class="principle-btn" onclick="selectPrinciple(this, 'Leadership')">
                    <span>LEADERSHIP</span>
                    <small style="font-size:0.6rem; opacity:0.8; margin-top:5px;">Listening & Guiding</small>
                </div>
            </div>

            <h4 class="section-label">3. Describe the Ethical Dilemma</h4>
            <div class="input-group" style="margin-bottom: 20px;">
                <textarea id="dilemmaInput" 
                          class="glass-input" 
                          style="height: 250px; margin-bottom: 0;" 
                          placeholder="Describe the situation using the STAR method (Situation, Task, Action, Result)...&#10;&#10;Example: My Project Manager is pressuring me to sign off on a drawing that I know hasn't been fully checked. They are citing 'commercial pressure' but I am worried about safety risk..."></textarea>
                <div class="word-count" id="wordCount">0 chars</div>
            </div>

            <button id="aiBtn" class="btn-ai" onclick="generateAnalysis()" style="display:none; margin-top:0;">
                >> Generate AI Script
            </button>

            <div id="outputArea" class="terminal-output" style="display:none;">
                <h4 style="color:var(--terminal-green); margin-top:0;">Ethical Analysis & Script</h4>
                <div id="analysisText"></div>
            </div>

        </div>
    </div>

    <div id="footer-container"></div>

    <script src="header_nav.js?v=14"></script>
    <script src="tools_data.js?v=14"></script>
    <script>
        let selectedPrinciple = '';

        // WORD COUNT LISTENER
        const dilemmaInput = document.getElementById('dilemmaInput');
        if(dilemmaInput) {
            dilemmaInput.addEventListener('input', function() {
                document.getElementById('wordCount').innerText = this.value.length + " chars";
                if(this.value.length > 50 && selectedPrinciple !== '') {
                    document.getElementById('aiBtn').style.display = 'block';
                }
            });
        }

        // PRINCIPLE SELECTION LOGIC
        function selectPrinciple(el, principle) {
            // Visual Toggle
            document.querySelectorAll('.principle-btn').forEach(b => b.classList.remove('selected'));
            el.classList.add('selected');
            selectedPrinciple = principle;

            // Show AI button if text exists
            if(document.getElementById('dilemmaInput').value.length > 50) {
                document.getElementById('aiBtn').style.display = 'block';
            }
        }

        // --- CORE LOGIC: GENERATE ANALYSIS ---
        function generateAnalysis() {
            const userRole = document.getElementById('userRole').value || "Engineer";
            const industry = document.getElementById('industry').value;
            const input = document.getElementById('dilemmaInput').value;
            const principle = selectedPrinciple;

            // Validation
            if (input.length < 50 || principle === '') {
                alert("Please select a Principle and describe the dilemma (min 50 chars).");
                return;
            }

            // Show Output
            const outputDiv = document.getElementById('outputArea');
            outputDiv.style.display = 'block';
            const analysisTextDiv = document.getElementById('analysisText');
            
            // Get Context for RAEng Principles
            let principleContext = "";
            let legalRef = "";

            switch(principle) {
                case 'Accuracy':
                    principleContext = "Duty to be rigorous, keep knowledge up to date, and not mislead.";
                    legalRef = "Health and Safety at Work Act 1974 (Section 7)";
                    break;
                case 'Honesty':
                    principleContext = "Duty to reject bribery and declare conflicts of interest.";
                    legalRef = "Bribery Act 2010";
                    break;
                case 'Respect':
                    principleContext = "Duty to respect life, law, and the environment.";
                    legalRef = "Equality Act 2010 / Environmental Protection Act 1990";
                    break;
                case 'Leadership':
                    principleContext = "Duty to listen to concerns and promote public awareness.";
                    legalRef = "Public Interest Disclosure Act 1998 (Whistleblowing)";
                    break;
            }

            // 1. Static Analysis Output
            const analysisHTML = `
                <strong style="color:var(--terminal-green)">>> ANALYSIS MODE: ACTIVE</strong><br><br>
                <strong>PRIMARY PRINCIPLE:</strong> ${principle.toUpperCase()}<br>
                <em>"${principleContext}"</em><br><br>
                <strong>RELEVANT LEGISLATION:</strong> ${legalRef}<br><br>
                <strong>SUGGESTED ACTION PLAN:</strong><br>
                1. Document the request in writing immediately (email/diary).<br>
                2. Request a formal Risk Assessment before proceeding.<br>
                3. If safety is compromised, refuse the task citing <a href="#" style="color:#fff; text-decoration:underline;">Engineering Council Guidance on Whistleblowing</a>.
                <br><br>
                <hr style="border:0; border-top:1px dashed #444; margin:15px 0;">
                <strong style="color:var(--terminal-green)">>> AI PROMPT GENERATED BELOW</strong><br>
                <em style="font-size:0.85rem; color:#8899a6;">(Copy this into ChatGPT/Claude to get a specific script)</em>
            `;
            
            analysisTextDiv.innerHTML = analysisHTML;

            // 2. GENERATE AI PROMPT TEXT
            const aiPromptText = `Act as a Fellow of the IET/IMechE. I am a ${userRole} in the ${industry} industry.
            I need to challenge a senior stakeholder regarding this ethical dilemma:
            "${input}"

            Please analyze this using the RAEng Statement of Ethical Principles (Focus: ${principle}).

            1. Identify the specific UK-SPEC clause violated (e.g., E1, E2, E3, E5).
            2. Draft a professional but firm script I can use in a face-to-face meeting to refuse this request politely.
            3. Explain the long-term commercial risk if we ignore this (e.g. legal action under ${legalRef}).`;

            // 3. Update Button State (Copy Logic)
            const btn = document.getElementById('aiBtn');
            btn.innerHTML = ">> COPY AI PROMPT TO CLIPBOARD";
            
            // Remove old listeners to prevent stacking
            const newBtn = btn.cloneNode(true);
            btn.parentNode.replaceChild(newBtn, btn);
            
            newBtn.onclick = function() {
                navigator.clipboard.writeText(aiPromptText).then(() => {
                    newBtn.innerHTML = ">> COPIED! PASTE INTO AI MODEL";
                    newBtn.style.borderColor = "#fff";
                    newBtn.style.color = "#fff";
                    setTimeout(() => { 
                        newBtn.innerHTML = ">> GENERATE AI SCRIPT";
                        newBtn.style.borderColor = "";
                        newBtn.style.color = "";
                    }, 3000);
                });
            };
        } 

        // --- 5. INITIALISATION TRIGGER ---
        function initApp() {
            if (typeof renderToolHeader === "function") {
                renderToolHeader('ethics');
            } else {
                console.warn("Tool Header system not loaded.");
            }
        }
        
        document.addEventListener("DOMContentLoaded", initApp);
    </script>
	<script defer src="footer.js?v=14"></script>
</body>
</html>
